# Cluster map served by the coordinator.
#
#   epoch  <n>        ownership epoch; the coordinator increases it on every ownership change
#   vnodes <n>        virtual nodes per shard on the consistent hash ring
#   shard  <id> <primary host:port> [<replica host:port>]
#
# Only shards are placed on the ring. Each shard's replica mirrors its primary.

epoch 1
vnodes 100

shard s1 127.0.0.1:7101 127.0.0.1:7102
shard s2 127.0.0.1:7201 127.0.0.1:7202
